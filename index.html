<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <link rel="icon" href="data:,">
  <title>Круизы · Мини‑приложение</title>

  <!-- (Опционально) базовые стили сайта/демо -->
  <link rel="stylesheet" href="assets/bootstrap.css">
  <link rel="stylesheet" href="assets/styles.css">

  <!-- Стили виджета -->
  <link rel="stylesheet" href="assets/app.c8a9b738.css">
  <link rel="stylesheet" href="assets/app.css">
  <link rel="stylesheet" href="assets/dark.css">
  <link rel="stylesheet" href="assets/simple.css">

  <style>
    /* Делает верх/низ читаемым в светлой и тёмной теме Telegram,
       не трогая стили самого виджета */
    :root { color-scheme: light dark; }

    body{
      margin:0;
      background: var(--tg-theme-secondary-bg-color, #f3f4f6);
      color: var(--tg-theme-text-color, #111);
    }

    .twa-wrap{
      max-width: 1200px;
      margin: 16px auto;
      padding: 0 12px;
    }

    /* “шапка” с текстом — на фоне, который читается в обеих темах */
    .twa-head{
      margin: 12px 0 14px;
      padding: 14px 14px 12px;
      border-radius: 14px;
      background: var(--tg-theme-bg-color, #fff);
      box-shadow: 0 6px 24px rgba(0,0,0,.08);
    }

    h1{
      font-size: 28px;
      margin: 0 0 6px;
      color: var(--tg-theme-text-color, #111);
    }

    .sub{
      margin: 0;
      color: var(--tg-theme-hint-color, #6b7280);
    }
  </style>
</head>
<body>
  <div class="twa-wrap">
    <div class="twa-head">
      <h1>Морские круизы</h1>
      <p class="sub">Выберите параметры — и отправьте их в чат бота</p>
    </div>

    <!-- Корневой элемент виджета -->
    <div id="ces" class="ces-app ces-theme-simple"></div>
  </div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Настройки виджета -->
  <script>
    window.cesSettings = {
      email : "robocraft0007@gmail.com",
      showResults: true,
      currencies: ["EUR","RUB","USD"],
      theme: "simple"
    };
  </script>

  <!-- Скрипты -->
  <script src="assets/jquery.min.js"></script>
  <script src="assets/bootstrap.min.js"></script>

  <!-- Основной скрипт виджета (из демо) -->
  <script src="assets/app.js"></script>

  <!-- Мост с Telegram -->
  <script src="twa-bridge.js"></script>
</body>
</html>
